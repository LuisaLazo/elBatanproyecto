<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-batan-primary mb-0">Gestion de productos</h2>
        <a routerLink="/productos/nuevo" class="btn btn-success">
            <i class="bi bi-plus-square me-1"></i> Añadir producto
        </a>
    </div>

    <table class="table table-hover shadow-sm">
        <thead class="bg-batan-primary text-white">
            <tr>
                <th>Numero </th>
                <th>Imagen</th>
                <th>Nombres</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>

            </tr>

        </thead>
        <tbody>
            @for (p of products; track p.id; let i = $index) {
            <tr>
                <td>{{i+1}}</td>
                <td><img [src]="p.imagen" width="50" class="rounded"></td>
                <td>{{p.nombre}}</td>
                <td>{{p.precio}}</td>
                <td>{{p.stock}}</td>

                <td>
                    <a [routerLink]="['/productos/editar', p.id]" class="btn btn-sm btn-warning me-2">
                        <i class="bi bi-box-arrow-in-down me-1"></i> Editar
                    </a>

                    <button (click)="eliminar(p.id!)" class="btn btn-sm btn-danger">
                        <i class="bi bi-trash-fill me-1"></i> Eliminar
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>

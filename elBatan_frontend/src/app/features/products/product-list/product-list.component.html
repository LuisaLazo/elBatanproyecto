<div class="container mt-4">
    <div class="d-flex justfy-content-between align-items-center mb-3">
        <h2 class="text-batan-primary">Gestion de productos</h2>
        <a routerLink="/productos/nuevo" class="btn btn-success">Nuevo Producto</a>
    </div>

    <table class="table table-hover shadow-sm">
        <thead class="bg-batan-primary text-white">
            <tr>
                <th>Imagen</th>
                <th>Nombres</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>

            </tr>

        </thead>
        <tbody>
            @for (p of products; track p.id){
                <tr>
                    <td><img [src]="p.imagen" width="50" class="rounded"></td>
                    <td>{{p.nombre}}</td>
                    <td>{{p.precio}}</td>
                    <td>{{p.stock}}</td>
                    
                    <td>
                        <a [routerLink]="['/productos/editar', p.id]" class="btn btn-sm btn-warning">Editar</a>
                        <button (click)="eliminar(p.id!)" class="btn btn-sm btn-danger">Eliminar</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>

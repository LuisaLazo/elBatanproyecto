
spring:
  application:
    name: elBatan

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XE
    username: US_elBatan
    password: admin123
    driver-class-name: oracle.jdbc.OracleDriver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: ELBATANLP2
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  servlet:
    context-path: /elBatan
  port: 8082

storage:
  location: "images"

evidencias:
  location: "evidencias"

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 36000000
